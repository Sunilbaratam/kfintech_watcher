name: Watch KFintech client_id mapping

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC — adjust as needed
  workflow_dispatch: {}     # allows manual trigger from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run watcher
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: npm run check

      - name: Commit updated mapping if changed
        run: |
          git config user.name "kfintech-client-id-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update client_id mapping snapshot"
          git push